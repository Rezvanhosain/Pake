name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL, auto-fetch if empty"
        required: false
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      min_width:
        description: "Minimum window width (px)"
        required: false
      min_height:
        description: "Minimum window height (px)"
        required: false
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false
      tabs:
        description: "Enable browser tabs, session restore, and bookmarks"
        required: false
        type: boolean
        default: true
      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Package formats (comma-separated: deb,appimage,rpm,zst)"
        required: false
        default: "deb"
      extra_args:
        description: "Extra pake-cli flags, e.g. --show-toolbar --translate en --external-links window --new-window"
        required: false
        default: ""

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        run: |
          ARGS=("${{ inputs.url }}" "--name" "${{ inputs.name }}")

          if [ -n "${{ inputs.icon }}" ]; then
            ARGS+=("--icon" "${{ inputs.icon }}")
          fi

          if [ -n "${{ inputs.width }}" ]; then
            ARGS+=("--width" "${{ inputs.width }}")
          fi

          if [ -n "${{ inputs.height }}" ]; then
            ARGS+=("--height" "${{ inputs.height }}")
          fi

          if [ -n "${{ inputs.min_width }}" ]; then
            ARGS+=("--min-width" "${{ inputs.min_width }}")
          fi

          if [ -n "${{ inputs.min_height }}" ]; then
            ARGS+=("--min-height" "${{ inputs.min_height }}")
          fi

          if [ -n "${{ inputs.app_version }}" ]; then
            ARGS+=("--app-version" "${{ inputs.app_version }}")
          fi

          if [ "${{ inputs.fullscreen }}" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "${{ inputs.hide_title_bar }}" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "${{ inputs.tabs }}" == "true" ]; then
            ARGS+=("--tabs")
          fi

          if [ "${{ inputs.multi_arch }}" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "${{ inputs.targets }}" ] && [ "${{ runner.os }}" == "Linux" ]; then
            ARGS+=("--targets" "${{ inputs.targets }}")
          fi

          if [ -n "${{ inputs.extra_args }}" ]; then
            read -ra EXTRA <<< "${{ inputs.extra_args }}"
            ARGS+=("${EXTRA[@]}")
          fi

          echo "===== Pake build configuration summary ====="
          echo "URL:          ${{ inputs.url }}"
          echo "App name:     ${{ inputs.name }}"
          echo "Tabs enabled: ${{ inputs.tabs }} (browser tabs, session restore, bookmarks)"
          echo "Running: node dist/cli.js ${ARGS[@]}"
          echo "============================================"
          node dist/cli.js "${ARGS[@]}"

      - name: Verify tabbed mode in generated config (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CONFIG="src-tauri/.pake/pake.json"
          echo "Inspecting canonical config: $CONFIG"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Generated config $CONFIG not found; cannot verify tabbed mode."
            exit 1
          fi
          # Canonical location for the flag is windows[0].tabs
          TABS_VALUE=$(node -e "const c=require('./src-tauri/.pake/pake.json');console.log(JSON.stringify(c.windows?.[0]?.tabs))")
          echo "----- $CONFIG -----"
          echo "windows[0].tabs = $TABS_VALUE"
          echo "-------------------"
          if [ "${{ inputs.tabs }}" == "true" ]; then
            if [ "$TABS_VALUE" == "true" ]; then
              echo "Verified: generated config contains windows[0].tabs = true"
            else
              echo "::error::Tabs were requested but generated config does not contain \"tabs\": true. Refusing to ship the single-window variant."
              exit 1
            fi
          fi

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $args = "${{ inputs.url }}", "--name", "${{ inputs.name }}"

          if ("${{ inputs.icon }}" -ne "") {
            $args += "--icon", "${{ inputs.icon }}"
          }

          if ("${{ inputs.width }}" -ne "") {
            $args += "--width", "${{ inputs.width }}"
          }

          if ("${{ inputs.height }}" -ne "") {
            $args += "--height", "${{ inputs.height }}"
          }

          if ("${{ inputs.min_width }}" -ne "") {
            $args += "--min-width", "${{ inputs.min_width }}"
          }

          if ("${{ inputs.min_height }}" -ne "") {
            $args += "--min-height", "${{ inputs.min_height }}"
          }

          if ("${{ inputs.app_version }}" -ne "") {
            $args += "--app-version", "${{ inputs.app_version }}"
          }

          if ("${{ inputs.fullscreen }}" -eq "true") {
            $args += "--fullscreen"
          }

          if ("${{ inputs.hide_title_bar }}" -eq "true") {
            $args += "--hide-title-bar"
          }

          if ("${{ inputs.tabs }}" -eq "true") {
            $args += "--tabs"
          }

          $extraArgs = "${{ inputs.extra_args }}"
          if ($extraArgs.Trim() -ne "") {
            $args += $extraArgs -split '\s+'
          }

          Write-Host "===== Pake build configuration summary ====="
          Write-Host "URL:          ${{ inputs.url }}"
          Write-Host "App name:     ${{ inputs.name }}"
          Write-Host "Tabs enabled: ${{ inputs.tabs }} (browser tabs, session restore, bookmarks)"
          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          Write-Host "============================================"
          node dist/cli.js $args

          git checkout -- src-tauri/Cargo.lock

      - name: Verify tabbed mode in generated config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = "src-tauri/.pake/pake.json"
          Write-Host "Inspecting canonical config: $config"
          if (-not (Test-Path $config)) {
            Write-Host "::error::Generated config $config not found; cannot verify tabbed mode."
            exit 1
          }
          $json = Get-Content $config -Raw | ConvertFrom-Json
          # Canonical location for the flag is windows[0].tabs
          $tabsValue = $json.windows[0].tabs
          Write-Host "----- $config -----"
          Write-Host "windows[0].tabs = $tabsValue"
          Write-Host "-------------------"
          if ("${{ inputs.tabs }}" -eq "true") {
            if ($tabsValue -eq $true) {
              Write-Host "Verified: generated config contains windows[0].tabs = true"
            } else {
              Write-Host "::error::Tabs were requested but generated config does not contain `"tabs`": true. Refusing to ship the single-window variant."
              exit 1
            }
          }

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: ${{ inputs.name }}.deb
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: ${{ inputs.name }}.AppImage
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: ${{ inputs.name }}.rpm
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: ${{ inputs.name }}-*.pkg.tar.zst
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload MSI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          retention-days: 3

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
